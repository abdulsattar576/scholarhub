name: scholarship-platform

services:
  # 1. PostgreSQL Database (Initializes distinct logical databases via database/init-db.sh)
  postgres:
    image: postgres:16-alpine
    container_name: scholarship-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_secret}
      SCHOLARSHIP_DB_PASSWORD: ${SCHOLARSHIP_DB_PASSWORD:-scholarship_secret}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:-application_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - scholarship-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Broker
  redis:
    image: redis:7-alpine
    container_name: scholarship-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-redis_secret} 
      --maxmemory 384mb 
      --maxmemory-policy noeviction 
      --save 60 1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - scholarship-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Public API Gateway (NestJS REST API)
  api-gateway:
    container_name: scholarship-api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      SCHOLARSHIP_GRPC_URL: scholarship-service:50051
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      DATABASE_URL: postgresql://identity_user:${IDENTITY_DB_PASSWORD:-identity_secret}@postgres:5432/identity_db?schema=public
      IDENTITY_DATABASE_URL: postgresql://identity_user:${IDENTITY_DB_PASSWORD:-identity_secret}@postgres:5432/identity_db?schema=public
      SCHOLARSHIP_DATABASE_URL: postgresql://scholarship_user:${SCHOLARSHIP_DB_PASSWORD:-scholarship_secret}@postgres:5432/scholarship_db?schema=public
      APPLICATION_DATABASE_URL: postgresql://application_user:${APPLICATION_DB_PASSWORD:-application_secret}@postgres:5432/application_db?schema=public
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_change_me_in_production_32chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - document_storage:/app/storage/documents
    networks:
      - scholarship-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Scholarship Catalog Microservice (NestJS gRPC)
  scholarship-service:
    container_name: scholarship-service
    build:
      context: ./scholarship-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRPC_PORT: 50051
      DATABASE_URL: postgresql://scholarship_user:${SCHOLARSHIP_DB_PASSWORD:-scholarship_secret}@postgres:5432/scholarship_db?schema=public
    expose:
      - "50051"
    volumes:
      - ./proto:/app/proto:ro
    networks:
      - scholarship-network
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Crawler & AI Extractor Service (Python)
  crawler-service:
    container_name: crawler-service
    build:
      context: ./crawler-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      GRPC_PORT: 50052
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    expose:
      - "50052"
    volumes:
      - ./proto:/app/proto:ro
      - ./crawler-service:/app
    networks:
      - scholarship-network

  # 6. Web Frontend (Next.js Application)
  client:
    container_name: scholarship-client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    networks:
      - scholarship-network
    depends_on:
      - api-gateway

networks:
  scholarship-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  document_storage:
